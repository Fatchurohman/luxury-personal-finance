<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AuraFinance - Luxury Finance & Kasbon Tracker</title>
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --card-bg: #14161d;
      --card-border: #262933;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --text-main: #f5f5f7;
      --text-muted: #8e92a4;
      --success: #2ecc71;
      --danger: #e74c3c;
      --radius: 12px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header & Developer Identity */
    header {
      text-align: center;
      padding: 12px 0;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #f9f5e8 0%, #d4af37 50%, #aa8010 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .dev-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--gold-primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gold-primary);
      animation: goldPulse 1.8s infinite ease-in-out;
    }

    @keyframes goldPulse {
      0% {
        transform: scale(0.9);
        box-shadow: 0 0 2px var(--gold-primary);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.3);
        box-shadow: 0 0 12px var(--gold-primary), 0 0 4px #fff;
        opacity: 1;
      }
      100% {
        transform: scale(0.9);
        box-shadow: 0 0 2px var(--gold-primary);
        opacity: 0.7;
      }
    }

    /* Card Luxury Base */
    .luxury-card {
      background: linear-gradient(180deg, #181b24 0%, var(--card-bg) 100%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .luxury-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
    }

    /* Saldo Overview */
    .balance-card {
      text-align: center;
      padding: 20px 16px;
    }

    .balance-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-amount {
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold-light);
      margin: 8px 0 16px 0;
      text-shadow: 0 2px 10px var(--gold-glow);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      border-top: 1px solid var(--card-border);
      padding-top: 12px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-title {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .stat-value.income { color: var(--success); }
    .stat-value.expense { color: var(--danger); }
    .stat-value.debt { color: #f39c12; }

    /* Forms & Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input, select {
      background-color: #0b0c10;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 8px var(--gold-glow);
    }

    .btn {
      background: linear-gradient(135deg, #d4af37, #aa8010);
      color: #0a0b0e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: var(--transition);
    }

    .btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    .btn-secondary {
      background: #1c1f2b;
      color: var(--gold-light);
      border: 1px solid var(--card-border);
    }

    /* Tabs & Filter */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: #0f1016;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .tab-btn.active {
      background: var(--gold-primary);
      color: #0a0b0e;
      border-color: var(--gold-primary);
    }

    /* Transaction List */
    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .tx-list::-webkit-scrollbar {
      width: 4px;
    }

    .tx-list::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }

    .tx-item {
      background-color: #0f1118;
      border: 1px solid #1e212b;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
    }

    .tx-info h4 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .tx-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
    }

    .tx-amount {
      font-size: 0.95rem;
      font-weight: 700;
      text-align: right;
    }

    .tx-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #5a5f73;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      transition: var(--transition);
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 24px 0;
    }

    /* Quick Data Backup Panel */
    .backup-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .file-input-wrapper {
      position: relative;
      flex: 1;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <h1 class="brand-title">Aura Finance</h1>
      <div class="dev-badge">
        <span class="pulse-dot"></span>
        <span>developer : fatur62</span>
      </div>
    </header>

    <!-- Ringkasan Saldo -->
    <section class="luxury-card balance-card">
      <span class="balance-label">Total Saldo Bersih</span>
      <div class="balance-amount" id="totalBalance">Rp 0</div>
      
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-title">Pemasukan</span>
          <div class="stat-value income" id="totalIncome">Rp 0</div>
        </div>
        <div class="stat-item">
          <span class="stat-title">Pengeluaran</span>
          <div class="stat-value expense" id="totalExpense">Rp 0</div>
        </div>
        <div class="stat-item">
          <span class="stat-title">Kasbon (Piutang)</span>
          <div class="stat-value debt" id="totalKasbon">Rp 0</div>
        </div>
        <div class="stat-item">
          <span class="stat-title">Utang Saya</span>
          <div class="stat-value expense" id="totalUtang">Rp 0</div>
        </div>
      </div>
    </section>

    <!-- Form Transaksi Baru -->
    <section class="luxury-card">
      <form id="txForm">
        <div class="form-group">
          <label for="txType">Jenis Pencatatan</label>
          <select id="txType" required>
            <option value="income">Pemasukan (+)</option>
            <option value="expense">Pengeluaran (-)</option>
            <option value="kasbon">Kasbon (Dipinjam Orang)</option>
            <option value="debt">Utang (Saya Meminjam)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="txDesc">Keterangan / Nama Peminjam</label>
          <input type="text" id="txDesc" placeholder="Contoh: Gaji, Makan, Kasbon Budi" required autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="txAmount">Nominal (Rp)</label>
          <input type="number" id="txAmount" placeholder="0" min="1" required />
        </div>

        <button type="submit" class="btn">Simpan Transaksi</button>
      </form>
    </section>

    <!-- Riwayat Transaksi -->
    <section class="luxury-card">
      <div class="tabs">
        <button class="tab-btn active" data-filter="all">Semua</button>
        <button class="tab-btn" data-filter="income">Masuk</button>
        <button class="tab-btn" data-filter="expense">Keluar</button>
        <button class="tab-btn" data-filter="kasbon_debt">Kasbon/Utang</button>
      </div>

      <div class="tx-list" id="txListContainer">
        <!-- Rendered by JS -->
      </div>

      <!-- Backup JSON -->
      <div class="backup-actions">
        <button class="btn btn-secondary" id="btnExport" style="font-size: 0.75rem; padding: 8px;">Backup Data</button>
        <div class="file-input-wrapper">
          <button class="btn btn-secondary" style="font-size: 0.75rem; padding: 8px; width: 100%;">Restore Data</button>
          <input type="file" id="importFileInput" accept=".json" />
        </div>
      </div>
    </section>
  </div>

  <script>
    // State Management & Storage Key
    const STORAGE_KEY = "aura_finance_v1_fatur62";
    let transactions = [];
    let currentFilter = "all";

    // Format Rupiah Standar
    const formatIDR = (amount) => {
      const num = Number(amount) || 0;
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(num);
    };

    // Format Tanggal
    const formatDate = (isoString) => {
      if (!isoString) return "-";
      const date = new Date(isoString);
      return date.toLocaleDateString("id-ID", {
        day: "2-digit",
        month: "short",
        hour: "2-digit",
        minute: "2-digit"
      });
    };

    // Validasi & Parsing Data JSON LocalStorage Secara Aman
    const loadTransactions = () => {
      try {
        const rawData = localStorage.getItem(STORAGE_KEY);
        if (!rawData) {
          transactions = [];
          return;
        }
        const parsed = JSON.parse(rawData);
        if (Array.isArray(parsed)) {
          transactions = parsed.filter(item => 
            item && 
            typeof item.id === "string" && 
            typeof item.amount === "number" &&
            !isNaN(item.amount) &&
            typeof item.type === "string"
          );
        } else {
          transactions = [];
        }
      } catch (err) {
        console.error("Gagal mengurai LocalStorage JSON:", err);
        transactions = [];
      }
    };

    const saveTransactions = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
      } catch (err) {
        alert("Penyimpanan lokal penuh atau dinonaktifkan!");
        console.error("Gagal menyimpan ke LocalStorage:", err);
      }
    };

    // Kalkulasi Dashboard
    const updateDashboard = () => {
      let income = 0;
      let expense = 0;
      let kasbon = 0;
      let debt = 0;

      transactions.forEach(t => {
        const val = Number(t.amount) || 0;
        if (t.type === "income") income += val;
        else if (t.type === "expense") expense += val;
        else if (t.type === "kasbon") kasbon += val;
        else if (t.type === "debt") debt += val;
      });

      const netBalance = income - expense;

      document.getElementById("totalBalance").textContent = formatIDR(netBalance);
      document.getElementById("totalIncome").textContent = formatIDR(income);
      document.getElementById("totalExpense").textContent = formatIDR(expense);
      document.getElementById("totalKasbon").textContent = formatIDR(kasbon);
      document.getElementById("totalUtang").textContent = formatIDR(debt);
    };

    // Render List Transaksi
    const renderList = () => {
      const container = document.getElementById("txListContainer");
      container.innerHTML = "";

      const filtered = transactions.filter(t => {
        if (currentFilter === "all") return true;
        if (currentFilter === "kasbon_debt") return t.type === "kasbon" || t.type === "debt";
        return t.type === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">Belum ada catatan pada kategori ini.</div>`;
        return;
      }

      filtered.forEach(item => {
        const row = document.createElement("div");
        row.className = "tx-item";

        let typeLabel = "Pemasukan";
        let colorClass = "income";
        let prefix = "+";

        if (item.type === "expense") {
          typeLabel = "Pengeluaran";
          colorClass = "expense";
          prefix = "-";
        } else if (item.type === "kasbon") {
          typeLabel = "Kasbon (Piutang)";
          colorClass = "debt";
          prefix = "•";
        } else if (item.type === "debt") {
          typeLabel = "Utang";
          colorClass = "expense";
          prefix = "•";
        }

        row.innerHTML = `
          <div class="tx-info">
            <h4>${escapeHTML(item.description || "Tanpa Keterangan")}</h4>
            <div class="tx-meta">
              <span>${typeLabel}</span>
              <span>•</span>
              <span>${formatDate(item.createdAt)}</span>
            </div>
          </div>
          <div class="tx-actions">
            <div class="tx-amount ${colorClass}">${prefix} ${formatIDR(item.amount)}</div>
            <button class="btn-delete" data-id="${item.id}" title="Hapus">✕</button>
          </div>
        `;

        container.appendChild(row);
      });
    };

    // Keamanan XSS untuk input teks
    const escapeHTML = (str) => {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    };

    // Handler Tambah Transaksi
    document.getElementById("txForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const type = document.getElementById("txType").value;
      const desc = document.getElementById("txDesc").value.trim();
      const amount = parseFloat(document.getElementById("txAmount").value);

      if (!desc || isNaN(amount) || amount <= 0) {
        alert("Harap masukkan keterangan dan nominal yang valid.");
        return;
      }

      const newTx = {
        id: "tx_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7),
        type,
        description: desc,
        amount,
        createdAt: new Date().toISOString()
      };

      transactions.unshift(newTx);
      saveTransactions();
      updateDashboard();
      renderList();

      document.getElementById("txDesc").value = "";
      document.getElementById("txAmount").value = "";
    });

    // Handler Hapus Item
    document.getElementById("txListContainer").addEventListener("click", (e) => {
      if (e.target.classList.contains("btn-delete")) {
        const id = e.target.getAttribute("data-id");
        if (confirm("Hapus catatan ini?")) {
          transactions = transactions.filter(t => t.id !== id);
          saveTransactions();
          updateDashboard();
          renderList();
        }
      }
    });

    // Handler Tab Filter
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        currentFilter = e.target.getAttribute("data-filter");
        renderList();
      });
    });

    // Export Data JSON
    document.getElementById("btnExport").addEventListener("click", () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `aurafinance_backup_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // Import Data JSON
    document.getElementById("importFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (Array.isArray(parsed)) {
            transactions = parsed;
            saveTransactions();
            updateDashboard();
            renderList();
            alert("Data berhasil dipulihkan!");
          } else {
            alert("Format file JSON tidak valid.");
          }
        } catch (err) {
          alert("Gagal membaca file JSON.");
          console.error(err);
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    // Inisialisasi App
    window.addEventListener("DOMContentLoaded", () => {
      loadTransactions();
      updateDashboard();
      renderList();
    });
  </script>
</body>
</html>
